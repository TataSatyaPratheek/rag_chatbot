[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmrag"
version = "0.4.0"  # Updated version number
description = "Multimodal Retrieval Augmented Generation system for processing complex documents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core dependencies
    "langchain>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Vector database
    "chromadb>=0.4.22",
    
    # Document processing
    "pymupdf>=1.23.8",  # For PDF processing
    "python-pptx>=0.6.21",  # For PowerPoint processing
    "unstructured[all-docs]>=0.11.0",  # Advanced document parsing
    
    # Embeddings and models
    "sentence-transformers>=2.2.2",
    "torch>=2.2.0",  # Compatible with MPS acceleration on M1
    "torchvision>=0.17.0",  # Needed for table detection models
    "transformers>=4.37.0",
    "accelerate>=0.25.0",
    
    # Computer vision
    "opencv-python>=4.8.0",
    "scikit-image>=0.21.0",
    "pillow>=10.1.0",
    
    # LLM Integration
    "httpx>=0.25.0",
    "tenacity>=8.2.3",
    "dspy-ai>=2.0.0",  # For guardrails
    
    # Document parsing integrations
    "docling>=0.1.0",  # For Docling integration (optional)
    "llama-parse>=0.1.0",  # For LlamaParse integration (optional)
    "llama-index>=0.9.0",  # For LlamaIndex/LlamaParse integration
    
    # Utilities
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.6.0",
    "psutil>=5.9.0", 
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "plotly>=5.13.0",  # For visualization in benchmarks
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.1",
    "ruff>=0.1.6",
    "pytest-mock>=3.10.0",
]
docling = [
    "docling>=0.1.0",
]
llamaparse = [
    "llama-parse>=0.1.0",
    "llama-index>=0.9.0",
]
all = [
    "docling>=0.1.0",
    "llama-parse>=0.1.0",
    "llama-index>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/multimodal-rag"
Documentation = "https://github.com/yourusername/multimodal-rag#readme"
Issues = "https://github.com/yourusername/multimodal-rag/issues"

[project.scripts]
mmrag = "mmrag.cli:app"

# Fixed this section to point to the src directory
[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "B", "I", "N", "UP", "ANN", "COM", "C4", "ICN", "PIE"]
ignore = ["ANN101"]  # Allow missing type annotation for self

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=mmrag --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test", 
    "stress: mark a test as a stress test",
]