<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
    <style>
      .title { font-size: 24px; font-weight: bold; text-anchor: middle; }
      .subtitle { font-size: 18px; font-weight: bold; text-anchor: middle; fill: #4b5563; }
      .doc-box { rx: 10; ry: 10; stroke: #9ca3af; stroke-width: 1.5; }
      .challenge-box { fill: #e0f2fe; }
      .problem-box { fill: #fee2e2; }
      .arrow { stroke: #6b7280; stroke-width: 2; marker-end: url(#arrowhead); }
      .label { font-size: 14px; fill: #1f2937; }
      .sublabel { font-size: 12px; fill: #4b5563; }
      .problem-text { font-size: 14px; fill: #991b1b; }
      .problem-icon { font-size: 20px; fill: #dc2626; font-weight: bold; }
    </style>
  
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
      </marker>
    </defs>
  
    <text x="400" y="40" class="title">The Challenge &amp; Problem with Document RAG</text>
  
    <!-- Document Types Section -->
    <text x="400" y="80" class="subtitle">Diverse Document Formats</text>
    
    <!-- PDF Document -->
    <g transform="translate(50, 110)">
      <rect width="120" height="120" class="doc-box challenge-box"/>
      <text x="60" y="50" class="label" text-anchor="middle">PDF</text>
      <text x="60" y="75" class="sublabel" text-anchor="middle">Complex Layout</text>
      <text x="60" y="95" class="sublabel" text-anchor="middle">Tables</text>
      <text x="60" y="115" class="sublabel" text-anchor="middle">Images</text>
    </g>
  
    <!-- DOCX Document -->
    <g transform="translate(200, 110)">
      <rect width="120" height="120" class="doc-box challenge-box"/>
      <text x="60" y="50" class="label" text-anchor="middle">DOCX</text>
      <text x="60" y="75" class="sublabel" text-anchor="middle">Rich Text</text>
      <text x="60" y="95" class="sublabel" text-anchor="middle">Formatting</text>
      <text x="60" y="115" class="sublabel" text-anchor="middle">Tables</text>
    </g>
    
    <!-- PPTX Document -->
    <g transform="translate(350, 110)">
      <rect width="120" height="120" class="doc-box challenge-box"/>
      <text x="60" y="50" class="label" text-anchor="middle">PPTX</text>
      <text x="60" y="75" class="sublabel" text-anchor="middle">Slide Layouts</text>
      <text x="60" y="95" class="sublabel" text-anchor="middle">Graphics</text>
      <text x="60" y="115" class="sublabel" text-anchor="middle">Animations</text>
    </g>
  
    <!-- Basic Text Document -->
    <g transform="translate(500, 110)">
      <rect width="120" height="120" class="doc-box challenge-box"/>
      <text x="60" y="50" class="label" text-anchor="middle">TEXT</text>
      <text x="60" y="75" class="sublabel" text-anchor="middle">Simple Content</text>
      <text x="60" y="95" class="sublabel" text-anchor="middle">No Formatting</text>
      <text x="60" y="115" class="sublabel" text-anchor="middle">Linear Reading</text>
    </g>
  
    <!-- HTML Document -->
    <g transform="translate(650, 110)">
      <rect width="120" height="120" class="doc-box challenge-box"/>
      <text x="60" y="50" class="label" text-anchor="middle">HTML</text>
      <text x="60" y="75" class="sublabel" text-anchor="middle">Web Content</text>
      <text x="60" y="95" class="sublabel" text-anchor="middle">CSS Styling</text>
      <text x="60" y="115" class="sublabel" text-anchor="middle">DOM Structure</text>
    </g>
  
    <!-- Problems Section -->
    <text x="400" y="270" class="subtitle">Current Solutions Fall Short</text>
  
    <!-- Problem 1: Structure Loss -->
    <g transform="translate(150, 300)">
      <rect width="200" height="120" class="doc-box problem-box"/>
      <text x="20" y="30" class="problem-icon">⚠</text>
      <text x="45" y="30" class="problem-text" font-weight="bold">Structure Loss</text>
      <text x="20" y="55" class="sublabel">• Tables converted to plain text</text>
      <text x="20" y="75" class="sublabel">• Hierarchies flattened</text>
      <text x="20" y="95" class="sublabel">• Layout context missing</text>
      <text x="20" y="115" class="sublabel">• Relationships lost</text>
    </g>
  
    <!-- Problem 2: Poor Retrieval -->
    <g transform="translate(450, 300)">
      <rect width="200" height="120" class="doc-box problem-box"/>
      <text x="20" y="30" class="problem-icon">⚠</text>
      <text x="45" y="30" class="problem-text" font-weight="bold">Inaccurate Results</text>
      <text x="20" y="55" class="sublabel">• Poor retrieval context</text>
      <text x="20" y="75" class="sublabel">• Misleading LLM responses</text>
      <text x="20" y="95" class="sublabel">• Missing critical information</text>
      <text x="20" y="115" class="sublabel">• Data relationships confused</text>
    </g>
  
    <!-- Example arrow connecting the problems -->
    <path d="M 250 260 C 250 250, 400 220, 400 260" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
    <path d="M 550 260 C 550 250, 400 220, 400 260" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  </svg>