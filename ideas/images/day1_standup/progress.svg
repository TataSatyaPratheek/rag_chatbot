<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

    <style>
      .title { font-size: 24px; font-weight: bold; text-anchor: middle; }
      .component-box { rx: 8; ry: 8; stroke: #9ca3af; stroke-width: 1.5; fill: #f3f4f6; }
      .component-title { font-size: 16px; font-weight: bold; text-anchor: middle; fill: #1f2937; }
      .component-detail { font-size: 12px; text-anchor: middle; fill: #4b5563; }
      .arrow { stroke: #6b7280; stroke-width: 2; marker-end: url(#arrowhead); }
      .flow-label { font-size: 11px; font-style: italic; fill: #6b7280; text-anchor: middle; }
    </style>
  
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
      </marker>
    </defs>
  
    <text x="400" y="40" class="title">mmrag - Project Progress Summary</text>
  
    <!-- Chainlit UI -->
    <g transform="translate(50, 100)">
      <rect width="180" height="100" class="component-box"/>
      <text x="90" y="30" class="component-title">Chainlit UI</text>
      <text x="90" y="55" class="component-detail">User Interaction</text>
      <text x="90" y="70" class="component-detail">File Upload (PDF, DOCX, PPTX)</text>
      <text x="90" y="85" class="component-detail">Actions &amp; Messaging</text>
    </g>
  
    <!-- Document Processing -->
    <g transform="translate(310, 100)">
      <rect width="180" height="100" class="component-box"/>
      <text x="90" y="30" class="component-title">Doc Processing</text>
      <text x="90" y="55" class="component-detail">Processor Factory</text>
      <text x="90" y="70" class="component-detail">OpenParse Integration</text>
      <text x="90" y="85" class="component-detail">Text/Table Elements</text>
    </g>
  
    <!-- Vector Store -->
    <g transform="translate(570, 100)">
      <rect width="180" height="100" class="component-box"/>
      <text x="90" y="30" class="component-title">Vector Store</text>
      <text x="90" y="55" class="component-detail">ChromaDB Integration</text>
      <text x="90" y="70" class="component-detail">Persistence &amp; Collections</text>
      <text x="90" y="85" class="component-detail">Embedding Storage</text>
    </g>
  
    <!-- Retrieval -->
     <g transform="translate(570, 250)">
      <rect width="180" height="80" class="component-box" fill="#e0f2fe"/>
      <text x="90" y="30" class="component-title">Retrieval</text>
      <text x="90" y="55" class="component-detail">Vector Similarity Search</text>
      <text x="90" y="70" class="component-detail">Context Gathering</text>
    </g>
  
    <!-- LLM Integration -->
    <g transform="translate(310, 250)">
      <rect width="180" height="100" class="component-box"/>
      <text x="90" y="30" class="component-title">LLM Integration</text>
      <text x="90" y="55" class="component-detail">Ollama Client</text>
      <text x="90" y="70" class="component-detail">RAG Prompting</text>
      <text x="90" y="85" class="component-detail">Streaming Responses</text>
    </g>
  
    <!-- Configuration & Utils -->
    <g transform="translate(50, 250)">
      <rect width="180" height="100" class="component-box" fill="#fef9c3"/>
      <text x="90" y="30" class="component-title">Config &amp; Utils</text>
      <text x="90" y="55" class="component-detail">.env Configuration</text>
      <text x="90" y="70" class="component-detail">Logging &amp; Error Handling</text>
      <text x="90" y="85" class="component-detail">Directory Management</text>
    </g>
  
    <!-- Arrows -->
    <line x1="230" y1="150" x2="310" y2="150" class="arrow"/>
    <text x="270" y="145" class="flow-label">Upload</text>
  
    <line x1="490" y1="150" x2="570" y2="150" class="arrow"/>
    <text x="530" y="145" class="flow-label">Process</text>
  
    <line x1="660" y1="200" x2="660" y2="250" class="arrow"/>
     <text x="685" y="230" class="flow-label">Store</text>
  
    <line x1="570" y1="290" x2="490" y2="290" class="arrow"/>
    <text x="530" y="305" class="flow-label">Retrieve</text>
  
    <line x1="310" y1="290" x2="230" y2="170" class="arrow" /> <!-- Arrow from LLM back towards UI -->
     <text x="270" y="235" class="flow-label">Generate</text>
  
    <!-- User Query Arrow -->
     <path d="M 140 200 Q 140 230, 315 260" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="4 4"/>
     <text x="220" y="240" class="flow-label">User Query</text>
  
  
    <!-- Overall System Boundary (Optional) -->
    <rect x="20" y="70" width="760" height="360" rx="15" ry="15" stroke="#d1d5db" stroke-width="1" fill="none" stroke-dasharray="5 5"/>
    <text x="400" y="450" font-size="10px" text-anchor="middle" fill="#9ca3af">Core Workflow and Supporting Components</text>
  
  </svg>
  