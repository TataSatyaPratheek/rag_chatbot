<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
    <style>
      .title { font-size: 24px; font-weight: bold; text-anchor: middle; }
      .component-box { rx: 8; ry: 8; stroke: #9ca3af; stroke-width: 1.5; }
      .component-title { font-size: 16px; font-weight: bold; text-anchor: middle; fill: #1f2937; }
      .component-detail { font-size: 12px; fill: #4b5563; }
      .arrow { stroke: #6b7280; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .data-flow { font-size: 11px; font-style: italic; fill: #6b7280; text-anchor: middle; }
      .requirements { font-size: 10px; fill: #4b5563; }
    </style>
  
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
      </marker>
    </defs>
  
    <text x="400" y="40" class="title">RAG Document Processing Architecture</text>
  
    <!-- Input Documents -->
    <g transform="translate(50, 100)">
      <rect width="140" height="80" class="component-box" fill="#e0f2fe"/>
      <text x="70" y="30" class="component-title">Input Documents</text>
      <text x="70" y="50" class="component-detail" text-anchor="middle">PDFs, DOCX, PPTX</text>
      <text x="70" y="65" class="component-detail" text-anchor="middle">Tables, Images, Text</text>
    </g>
  
    <!-- Document AI -->
    <g transform="translate(250, 80)">
      <rect width="160" height="120" class="component-box" fill="#fee2e2"/>
      <text x="80" y="30" class="component-title">Google Document AI</text>
      <text x="20" y="50" class="component-detail">• OCR and Layout Analysis</text>
      <text x="20" y="65" class="component-detail">• Form Parsing</text>
      <text x="20" y="80" class="component-detail">• Custom Extractors</text>
      <text x="20" y="95" class="requirements">$10-30 per 1,000 pages</text>
      <text x="20" y="110" class="requirements">Requires GCP Account and API Keys</text>
    </g>
  
    <!-- PyMuPDF -->
    <g transform="translate(250, 220)">
      <rect width="160" height="120" class="component-box" fill="#dcfce7"/>
      <text x="80" y="30" class="component-title">PyMuPDF</text>
      <text x="20" y="50" class="component-detail">• Basic PDF Processing</text>
      <text x="20" y="65" class="component-detail">• Text Extraction</text>
      <text x="20" y="80" class="component-detail">• Simple Layout Analysis</text>
      <text x="20" y="95" class="requirements">Open Source (AGPL)</text>
      <text x="20" y="110" class="requirements">Minimal Resources Required</text>
    </g>
  
    <!-- Table Transformer -->
    <g transform="translate(250, 360)">
      <rect width="160" height="120" class="component-box" fill="#fef9c3"/>
      <text x="80" y="30" class="component-title">Table Transformer</text>
      <text x="20" y="50" class="component-detail">• Table Detection</text>
      <text x="20" y="65" class="component-detail">• Structure Recognition</text>
      <text x="20" y="80" class="component-detail">• Cell Content Extraction</text>
      <text x="20" y="95" class="requirements">GPU Required (T4+)</text>
      <text x="20" y="110" class="requirements">$300-800/month (GPU costs)</text>
    </g>
  
    <!-- Visual Processing -->
    <g transform="translate(460, 180)">
      <rect width="160" height="120" class="component-box" fill="#dbeafe"/>
      <text x="80" y="30" class="component-title">Qwen2.5-VL</text>
      <text x="20" y="50" class="component-detail">• Visual Understanding</text>
      <text x="20" y="65" class="component-detail">• Image Content Analysis</text>
      <text x="20" y="80" class="component-detail">• Multi-modal Reasoning</text>
      <text x="20" y="95" class="requirements">Heavy GPU Required (A10/A100)</text>
      <text x="20" y="110" class="requirements">$1,100-3,200/month</text>
    </g>
  
    <!-- Vector Database -->
    <g transform="translate(660, 220)">
      <rect width="140" height="100" class="component-box" fill="#fbcfe8"/>
      <text x="70" y="30" class="component-title">Vector Database</text>
      <text x="20" y="50" class="component-detail">• Embedding Storage</text>
      <text x="20" y="65" class="component-detail">• Similarity Search</text>
      <text x="20" y="80" class="component-detail">• $150-400/month</text>
    </g>
  
    <!-- RAG Output -->
    <g transform="translate(660, 80)">
      <rect width="140" height="80" class="component-box" fill="#e0e7ff"/>
      <text x="70" y="30" class="component-title">RAG Output</text>
      <text x="70" y="50" class="component-detail" text-anchor="middle">Contextual Results</text>
      <text x="70" y="65" class="component-detail" text-anchor="middle">Structured Information</text>
    </g>
  
    <!-- Orchestration Layer -->
    <rect x="20" y="60" width="760" height="440" rx="15" ry="15" stroke="#d1d5db" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/>
    <text x="400" y="490" class="data-flow">Total Monthly Cost: $3,600-$9,750 for 100,000 pages/month</text>
  
    <!-- Arrows -->
    <line x1="190" y1="140" x2="250" y2="140" class="arrow"/>
    <line x1="190" y1="140" x2="230" y2="220" class="arrow" stroke-dasharray="4 2"/>
    <line x1="190" y1="140" x2="230" y2="420" class="arrow" stroke-dasharray="4 2"/>
    
    <line x1="410" y1="140" x2="460" y2="220" class="arrow"/>
    <line x1="410" y1="270" x2="460" y2="240" class="arrow"/>
    <line x1="410" y1="420" x2="460" y2="270" class="arrow"/>
    
    <line x1="620" y1="240" x2="660" y2="240" class="arrow"/>
    <line x1="730" y1="220" x2="730" y2="160" class="arrow"/>
  
    <!-- Flow Labels -->
    <text x="220" y="120" class="data-flow">Documents</text>
    <text x="435" y="210" class="data-flow">Processed</text>
    <text x="435" y="220" class="data-flow">Content</text>
    <text x="640" y="225" class="data-flow">Embeddings</text>
    <text x="740" y="190" class="data-flow">Query</text>
    <text x="740" y="200" class="data-flow">Results</text>
  </svg>