<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
    <style>
      .title { font-size: 24px; font-weight: bold; text-anchor: middle; }
      .consider-box { rx: 12; ry: 12; stroke: #9ca3af; stroke-width: 2; }
      .consider-title { font-size: 16px; font-weight: bold; text-anchor: middle; fill: #1f2937; }
      .consider-detail { font-size: 12px; fill: #4b5563; text-anchor: middle; }
      .center-circle { fill: #f1f5f9; stroke: #64748b; stroke-width: 3; }
      .center-text { font-size: 20px; font-weight: bold; text-anchor: middle; fill: #334155; }
      .connect-line { stroke: #64748b; stroke-width: 2; }
      .savings { font-size: 11px; font-weight: bold; fill: #16a34a; text-anchor: middle; }
      .effort { font-size: 11px; font-style: italic; fill: #6b7280; text-anchor: middle; }
      .icon-text { font-size: 24px; text-anchor: middle; }
    </style>
  
    <text x="400" y="40" class="title">Implementation Considerations for Cost Optimization</text>
    
    <!-- Center Circle -->
    <circle cx="400" cy="220" r="70" class="center-circle"/>
    <text x="400" y="210" class="center-text">Cost</text>
    <text x="400" y="235" class="center-text">Optimization</text>
  
    <!-- Hybrid Approach -->
    <g transform="translate(100, 100)">
      <rect width="190" height="140" class="consider-box" fill="#e0f2fe"/>
      <text x="110" y="30" class="consider-title">Hybrid Approach</text>
      <text x="95" y="55" class="consider-detail">Use Google Document AI for</text>
      <text x="95" y="70" class="consider-detail">specific document types while</text>
      <text x="95" y="85" class="consider-detail">processing others locally</text>
      <text x="95" y="110" class="savings">Potential Savings: 30-40%</text>
      <text x="95" y="125" class="effort">Implementation Effort: Medium</text>
      <text x="25" y="30" class="icon-text">🔄</text>
    </g>
    
    <!-- Auto-scaling -->
    <g transform="translate(560, 100)">
      <rect width="190" height="140" class="consider-box" fill="#dcfce7"/>
      <text x="95" y="30" class="consider-title">Auto-scaling</text>
      <text x="95" y="55" class="consider-detail">Implement dynamic scaling to</text>
      <text x="95" y="70" class="consider-detail">minimize costs during low</text>
      <text x="95" y="85" class="consider-detail">traffic periods</text>
      <text x="95" y="110" class="savings">Potential Savings: 15-25%</text>
      <text x="95" y="125" class="effort">Implementation Effort: Medium</text>
      <text x="25" y="30" class="icon-text">⚖️</text>
    </g>
    
    <!-- Batch Processing -->
    <g transform="translate(100, 270)">
      <rect width="190" height="140" class="consider-box" fill="#fef9c3"/>
      <text x="110" y="30" class="consider-title">Batch Processing</text>
      <text x="95" y="55" class="consider-detail">Implement batching to maximize</text>
      <text x="95" y="70" class="consider-detail">throughput and minimize</text>
      <text x="95" y="85" class="consider-detail">per-request costs</text>
      <text x="95" y="110" class="savings">Potential Savings: 10-20%</text>
      <text x="95" y="125" class="effort">Implementation Effort: Low</text>
      <text x="25" y="30" class="icon-text">📦</text>
    </g>
    
    <!-- Model Quantization -->
    <g transform="translate(560, 270)">
      <rect width="190" height="140" class="consider-box" fill="#dbeafe"/>
      <text x="112" y="30" class="consider-title">Model Quantization</text>
      <text x="95" y="55" class="consider-detail">Use int8 quantization for</text>
      <text x="95" y="70" class="consider-detail">models to reduce GPU memory</text>
      <text x="95" y="85" class="consider-detail">requirements and costs</text>
      <text x="95" y="110" class="savings">Potential Savings: 20-35%</text>
      <text x="95" y="125" class="effort">Implementation Effort: Medium-High</text>
      <text x="22" y="30" class="icon-text">🔍</text>
    </g>
    
    <!-- Reserved Instances -->
    <g transform="translate(330, 370)">
      <rect width="190" height="130" class="consider-box" fill="#fee2e2"/>
      <text x="110" y="30" class="consider-title">Reserved Instances</text>
      <text x="95" y="55" class="consider-detail">For consistent workloads,</text>
      <text x="95" y="70" class="consider-detail">consider reserved instances to</text>
      <text x="95" y="85" class="consider-detail">reduce compute costs</text>
      <text x="95" y="110" class="savings">Potential Savings: 30-60%</text>
      <text x="95" y="125" class="effort">Implementation Effort: Low</text>
      <text x="20" y="30" class="icon-text">💰</text>
    </g>
  
    <!-- Connecting Lines -->
    <line x1="290" y1="150" x2="330" y2="200" class="connect-line"/>
    <line x1="560" y1="150" x2="470" y2="200" class="connect-line"/>
    <line x1="290" y1="320" x2="330" y2="240" class="connect-line"/>
    <line x1="560" y1="320" x2="470" y2="250" class="connect-line"/>
    <line x1="425" y1="370" x2="420" y2="290" class="connect-line"/>
  
    <!-- Footer Note -->
    <text x="400" y="525" font-size="20px" text-anchor="middle" fill="#6b7280">A combined approach can reduce overall costs by 40-70%</text>
  </svg>