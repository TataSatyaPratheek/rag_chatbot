<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
    <style>
      .title { font-size: 24px; font-weight: bold; text-anchor: middle; }
      .resource-box { rx: 8; ry: 8; stroke: #9ca3af; stroke-width: 1.5; }
      .resource-category { font-size: 18px; font-weight: bold; text-anchor: middle; fill: #1f2937; }
      .resource-type { font-size: 14px; font-weight: bold; text-anchor: middle; fill: #1f2937; }
      .resource-detail { font-size: 12px; fill: #4b5563; }
      .resource-label { font-size: 10px; font-weight: bold; fill: #6b7280; text-anchor: middle; }
      .resource-meter { rx: 3; ry: 3; stroke: #9ca3af; stroke-width: 1; fill: #f3f4f6; }
      .meter-fill { rx: 3; ry: 3; }
    </style>
  
    <text x="400" y="40" class="title">Resource Requirements by Processing Type</text>
  
    <!-- Text Processing Resources -->
    <g transform="translate(50, 100)">
      <rect width="220" height="320" class="resource-box" fill="#f0fdf4"/>
      <text x="110" y="30" class="resource-category">Text Processing</text>
      <text x="110" y="50" class="resource-type">(Basic Document Parsing)</text>
      
      <!-- CPU Resources -->
      <text x="30" y="80" class="resource-detail">CPU Cores:</text>
      <rect x="120" y="70" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="70" width="40" height="15" class="meter-fill" fill="#16a34a"/>
      <text x="160" y="82" class="resource-label">2-4 cores</text>
      
      <!-- RAM Resources -->
      <text x="30" y="110" class="resource-detail">RAM:</text>
      <rect x="120" y="100" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="100" width="30" height="15" class="meter-fill" fill="#16a34a"/>
      <text x="160" y="112" class="resource-label">8GB</text>
      
      <!-- GPU Resources -->
      <text x="30" y="140" class="resource-detail">GPU:</text>
      <rect x="120" y="130" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="130" width="0" height="15" class="meter-fill" fill="#16a34a"/>
      <text x="160" y="142" class="resource-label">Not Required</text>
      
      <!-- Storage -->
      <text x="30" y="170" class="resource-detail">Storage:</text>
      <rect x="120" y="160" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="160" width="20" height="15" class="meter-fill" fill="#16a34a"/>
      <text x="160" y="172" class="resource-label">Low</text>
      
      <!-- Cost Level -->
      <text x="30" y="200" class="resource-detail">Cost Level:</text>
      <rect x="120" y="190" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="190" width="20" height="15" class="meter-fill" fill="#16a34a"/>
      <text x="160" y="202" class="resource-label">$ Low</text>
      
      <!-- Typical Tool -->
      <text x="30" y="240" class="resource-detail" font-weight="bold">Typical Tools:</text>
      <text x="30" y="260" class="resource-detail">• PyMuPDF</text>
      <text x="30" y="280" class="resource-detail">• Basic OCR</text>
      <text x="30" y="300" class="resource-detail">• Document AI (Layout)</text>
    </g>
    
    <!-- Table Processing Resources -->
    <g transform="translate(290, 100)">
      <rect width="220" height="320" class="resource-box" fill="#eff6ff"/>
      <text x="110" y="30" class="resource-category">Table Processing</text>
      <text x="110" y="50" class="resource-type">(Structure Recognition)</text>
      
      <!-- CPU Resources -->
      <text x="30" y="80" class="resource-detail">CPU Cores:</text>
      <rect x="120" y="70" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="70" width="60" height="15" class="meter-fill" fill="#2563eb"/>
      <text x="160" y="82" class="resource-label">4-8 cores</text>
      
      <!-- RAM Resources -->
      <text x="30" y="110" class="resource-detail">RAM:</text>
      <rect x="120" y="100" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="100" width="50" height="15" class="meter-fill" fill="#2563eb"/>
      <text x="160" y="112" class="resource-label">16GB</text>
      
      <!-- GPU Resources -->
      <text x="30" y="140" class="resource-detail">GPU:</text>
      <rect x="120" y="130" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="130" width="40" height="15" class="meter-fill" fill="#2563eb"/>
      <text x="160" y="142" class="resource-label">1x T4/V100</text>
      
      <!-- Storage -->
      <text x="30" y="170" class="resource-detail">Storage:</text>
      <rect x="120" y="160" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="160" width="40" height="15" class="meter-fill" fill="#2563eb"/>
      <text x="160" y="172" class="resource-label">Medium</text>
      
      <!-- Cost Level -->
      <text x="30" y="200" class="resource-detail">Cost Level:</text>
      <rect x="120" y="190" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="190" width="50" height="15" class="meter-fill" fill="#2563eb"/>
      <text x="160" y="202" class="resource-label">$$ Medium</text>
      
      <!-- Typical Tool -->
      <text x="30" y="240" class="resource-detail" font-weight="bold">Typical Tools:</text>
      <text x="30" y="260" class="resource-detail">• Table Transformer</text>
      <text x="30" y="280" class="resource-detail">• Document AI (Form)</text>
      <text x="30" y="300" class="resource-detail">• Custom Extractors</text>
    </g>
    
    <!-- Visual Processing Resources -->
    <g transform="translate(530, 100)">
      <rect width="220" height="320" class="resource-box" fill="#fef2f2"/>
      <text x="110" y="30" class="resource-category">Visual Processing</text>
      <text x="110" y="50" class="resource-type">(Multi-modal Understanding)</text>
      
      <!-- CPU Resources -->
      <text x="30" y="80" class="resource-detail">CPU Cores:</text>
      <rect x="120" y="70" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="70" width="70" height="15" class="meter-fill" fill="#dc2626"/>
      <text x="160" y="82" class="resource-label">8+ cores</text>
      
      <!-- RAM Resources -->
      <text x="30" y="110" class="resource-detail">RAM:</text>
      <rect x="120" y="100" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="100" width="70" height="15" class="meter-fill" fill="#dc2626"/>
      <text x="160" y="112" class="resource-label">32GB+</text>
      
      <!-- GPU Resources -->
      <text x="30" y="140" class="resource-detail">GPU:</text>
      <rect x="120" y="130" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="130" width="80" height="15" class="meter-fill" fill="#dc2626"/>
      <text x="160" y="142" class="resource-label">A10/A100</text>
      
      <!-- Storage -->
      <text x="30" y="170" class="resource-detail">Storage:</text>
      <rect x="120" y="160" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="160" width="60" height="15" class="meter-fill" fill="#dc2626"/>
      <text x="160" y="172" class="resource-label">High</text>
      
      <!-- Cost Level -->
      <text x="30" y="200" class="resource-detail">Cost Level:</text>
      <rect x="120" y="190" width="80" height="15" class="resource-meter"/>
      <rect x="120" y="190" width="80" height="15" class="meter-fill" fill="#dc2626"/>
      <text x="160" y="202" class="resource-label">$$$ High</text>
      
      <!-- Typical Tool -->
      <text x="30" y="240" class="resource-detail" font-weight="bold">Typical Tools:</text>
      <text x="30" y="260" class="resource-detail">• Qwen2.5-VL</text>
      <text x="30" y="280" class="resource-detail">• Document AI (Custom)</text>
      <text x="30" y="300" class="resource-detail">• Vision Transformers</text>
    </g>
    
    <!-- Volume Processing Scale -->
    <line x1="100" y1="460" x2="700" y2="460" stroke="#6b7280" stroke-width="1"/>
    <polygon points="100,460 90,455 90,465" fill="#6b7280"/>
    <polygon points="700,460 710,455 710,465" fill="#6b7280"/>
    <text x="400" y="480" font-size="18px" text-anchor="middle" fill="#4b5563">Processing Volume Scale (pages/month)</text>
    <text x="140" y="455" font-size="14px" text-anchor="middle" fill="#6b7280">Low Volume</text>
    <text x="400" y="455" font-size="14px" text-anchor="middle" fill="#6b7280">Medium Volume</text>
    <text x="700" y="455" font-size="14px" text-anchor="middle" fill="#6b7280">High Volume</text>
  </svg>